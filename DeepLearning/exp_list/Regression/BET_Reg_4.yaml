---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 512x512
  TRAIN_SPLIT: 0.8

MODEL:
  # A parameter to control model complexity 
  # (i.e. number of trainable parameters)
  NB_CHANNELS: 32
  USE_PREV_FRAMES: True
  NB_PREV_FRAMES: 9
  
TRAINING: 
  PREDICTION_TYPE: regression_temporal
  LEARNING_RATE: 0.00005
  EPOCH: 5
  BATCH_SIZE: 16
  # cpu (to run on cpu) or cuda (to run on gpu)
  DEVICE: cuda 
