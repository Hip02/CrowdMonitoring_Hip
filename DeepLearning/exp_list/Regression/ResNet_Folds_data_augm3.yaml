---
DATASET:
  FOLD_NUMBER: 0

MODEL:
  NB_CHANNELS: 64

TRAINING: 
  PREDICTION_TYPE: regression
  LEARNING_RATE: 0.0001
  EPOCH: 25
  BATCH_SIZE: 16
  DEVICE: cuda 



augmentation:
  flip_rotation:
    enable: false

  color:
    enable: true
    prob_apply: 0.5
    brightness: [1.25, 1.65] 
    contrast: [1.25, 1.65]

  noise_blur:
    enable: false
