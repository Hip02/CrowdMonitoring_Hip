---
DATASET:
  # size of the images 
  RESIZE_SHAPE: 512x512
  TRAIN_SPLIT: 0.8

MODEL:
  # A parameter to control model complexity 
  # (i.e. number of trainable parameters)
  NB_CHANNELS: 64
  #USE_ATROUS_CONV1 : True
  #USE_DILATION : True
  
TRAINING: 
  PREDICTION_TYPE: regression
  LEARNING_RATE: 0.000025
  SCHEDULER : True
  EPOCH: 30
  BATCH_SIZE: 16
  # cpu (to run on cpu) or cuda (to run on gpu)
  DEVICE: cuda 
