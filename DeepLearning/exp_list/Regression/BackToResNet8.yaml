---
DATASET:
  FOLD_NUMBER: 0
  FORCE_MAX_TO_0 : True
  USE_MEDIAN_LABELS: True

MODEL:
  NB_CHANNELS: 64
  USE_PREV_FRAMES: True
  NB_PREV_FRAMES: 9
  TIME_STEPS : 1

TRAINING: 
  PREDICTION_TYPE: regression
  RESNET_TYPE: resnet18
  LEARNING_RATE: 0.00005
  EPOCH: 20
  BATCH_SIZE: 16
  DEVICE: cuda 

augmentation:
  flip_rotation:
    enable: false

  color:
    enable: false

  noise_blur:
    enable: false

  mixup:
    enable: true
    prob_apply: 0.5
    min_maps: 1
    max_maps: 4
