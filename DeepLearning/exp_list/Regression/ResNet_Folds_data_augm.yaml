---
DATASET:
  FOLD_NUMBER: 0

MODEL:
  NB_CHANNELS: 64

TRAINING: 
  PREDICTION_TYPE: regression
  LEARNING_RATE: 0.0001
  EPOCH: 15
  BATCH_SIZE: 16
  DEVICE: cuda 



augmentation:
  flip_rotation:
    enable: true
    prob_apply: 0.5  # 50% de chances d’appliquer une transformation de type flip/rotation

  color:
    enable: true
    prob_apply: 0.6  # 60% de chances d’appliquer une modif brightness/contrast
    brightness: [0.8, 1.2]  # facteur aléatoire entre 0.8x et 1.2x
    contrast: [0.8, 1.2]

  noise_blur:
    enable: true
    prob_apply: 0.4  # 40% de chances d’appliquer soit un bruit, soit un flou
    prob_noise_vs_blur: 0.5  # 50% chance d'ajouter un bruit, 50% un flou
    gaussian_noise_std: 0.01
    blur_radius: 1.5
