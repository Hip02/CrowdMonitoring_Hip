---
DATASET:
  FOLD_NUMBER: 0

MODEL:
  NB_CHANNELS: 64

TRAINING: 
  PREDICTION_TYPE: regression
  LEARNING_RATE: 0.0001
  EPOCH: 15
  BATCH_SIZE: 16
  DEVICE: cuda 



augmentation:
  flip_rotation:
    enable: true
    prob_apply: 0.5
    mode: "flip90"

  color:
    enable: true
    prob_apply: 0.5
    brightness: [0.9, 1.1]
    contrast: [0.9, 1.1]

  noise_blur:
    enable: true
    prob_apply: 0.5         # Applique une transformation de cette catégorie ?
    prob_noise_vs_blur: 0.5 # Si oui, choisit bruit (p) vs blur (1-p)
    gaussian_noise_std: 0.01
    blur_radius: 1.5
