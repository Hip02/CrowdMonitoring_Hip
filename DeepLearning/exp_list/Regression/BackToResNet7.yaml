---
DATASET:
  FOLD_NUMBER: 0
  FORCE_MAX_TO_0 : True
  CROPPED_RADAR_MAPS: False

MODEL:
  NB_CHANNELS: 64

TRAINING: 
  PREDICTION_TYPE: regression
  RESNET_TYPE: resnet18
  LEARNING_RATE: 0.00005
  EPOCH: 20
  BATCH_SIZE: 16
  DEVICE: cuda 

augmentation:
  flip_rotation:
    enable: false
    prob_apply: 0.5

  color:
    enable: false

  noise_blur:
    enable: false
    prob_apply: 0.5
    prob_noise_vs_blur: 0.5
    gaussian_noise_std: [0.01, 0.02]
    blur_std: [2.5, 3.0]

  mixup:
    enable: true
    prob_apply: 1.0
