# Simple CNN with no previous frames and no data augmentation
---
DATASET:
  FOLD_NUMBER: 0
  STANDARDIZE_LABELS: true
  
MODEL:
    NB_CHANNELS: 10
    USE_PREV_FRAMES: True
    NB_PREV_FRAMES: 9
    TIME_STEPS : 2

TRAINING: 
  PREDICTION_TYPE: regression
  LEARNING_RATE: 0.00002
  EPOCH: 20
  BATCH_SIZE: 16
  DEVICE: cuda